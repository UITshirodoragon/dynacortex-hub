format:
  html:
    css: styles.css
    include-after-body: includes/layout-toggle.html
    theme: 
      light: flatly
      dark: darkly
    mermaid:
      theme: neutral
    toc: true
    toc-depth: 4
    code-copy: true
    code-fold: false
    number-sections: false
    smooth-scroll: true
    callout-appearance: default
    link-external-icon: true

bibliography: references/references.bib
execute:
  freeze: auto
