"on":
  push:
    branches:
      - main
  workflow_dispatch:

name: Render DynaCortex Hub

permissions:
  contents: write

concurrency:
  group: render-github-pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Jupyter
        run: python -m pip install jupyter

      - name: Render website to docs
        run: quarto render --output-dir docs --site-url https://uitshirodoragon.github.io/dynacortex-hub/docs/

      - name: Restore root index
        run: git checkout -- index.html

      - name: Commit rendered website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Render website"
          git push
