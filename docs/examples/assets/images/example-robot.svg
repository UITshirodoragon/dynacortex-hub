  <text x="450" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#475569">Perception → Cortex → Dynamics → Action</text>

  <rect x="90" y="190" width="150" height="80" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
