  <text x="165" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#075985">RGB / Depth</text>

  <rect x="300" y="190" width="150" height="80" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
