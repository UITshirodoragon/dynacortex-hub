  <text x="375" y="250" text-anchor="middle" font-family="Arial" font-size="14" fill="#713f12">AI / VLA</text>

  <rect x="510" y="190" width="150" height="80" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
