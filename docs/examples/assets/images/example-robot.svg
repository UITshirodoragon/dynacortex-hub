  <path d="M240 230 L300 230" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M450 230 L510 230" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M660 230 L720 230" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <defs>
